<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Currency Converter</h1>
      <p class="subtitle">Live exchange rates from the Frankfurter API</p>
    </header>

    <form id="converter-form" novalidate>
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" type="number" value="1" min="0" step="any" inputmode="decimal" placeholder="Enter amount">
      </div>

      <div class="currency-row">
        <div class="field">
          <label for="from-currency">From</label>
          <select id="from-currency">
            <option>Loading...</option>
          </select>
        </div>

        <button id="swap-button" class="swap-button" type="button" aria-label="Swap currencies" title="Swap currencies" disabled>&#8644;</button>

        <div class="field">
          <label for="to-currency">To</label>
          <select id="to-currency">
            <option>Loading...</option>
          </select>
        </div>
      </div>

      <button id="convert-button" class="convert-button" type="submit" disabled>Convert</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section class="result" aria-live="polite">
      <p id="result-from" class="result-from">Result</p>
      <p id="result-amount" class="result-amount">&mdash;</p>
      <p id="result-rate" class="result-meta">Exchange rate will appear here</p>
      <p id="result-date" class="result-meta"></p>
    </section>

    <footer>
      Data from <a href="https://frankfurter.dev" target="_blank" rel="noopener">Frankfurter</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
